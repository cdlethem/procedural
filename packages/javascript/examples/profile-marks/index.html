<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Profile marks — procedurals</title><link rel="icon" href="data:,"><style>body{margin:0;padding:24px;background:#f5f2e9;color:#242324;font:16px system-ui,sans-serif}main{max-width:1000px;margin:auto}h1{margin:0 0 8px;font-size:28px}p{line-height:1.5;max-width:67ch}#controls{display:flex;gap:9px;flex-wrap:wrap;margin:24px 0}button{font:inherit;padding:8px 10px;background:#fff;color:inherit;border:1px solid #777;border-radius:4px;cursor:pointer}kbd{font:inherit;border:1px solid #888;border-radius:3px;padding:1px 4px;background:#fff}canvas{display:block;width:min(640px,100%);height:auto}#status{min-height:1.5em}code{font-size:.9em}</style></head><body><main><h1>Profile marks</h1><p>Supply axial radius profiles, retain their indexed surfaces, then choose a form, subdivisions, closures and appearance independently.</p><div id="controls" aria-label="Profile marks controls"><button data-action="p"><kbd>P</kbd> profile</button><button data-action="d"><kbd>D</kbd> 8 / 32 slices</button><button data-action="b"><kbd>B</kbd> start cap</button><button data-action="t"><kbd>T</kbd> end cap</button><button data-action="c"><kbd>C</kbd> palette</button><button data-action="x"><kbd>X</kbd> three forms</button><button data-action="0"><kbd>0</kbd> reset</button><button data-action="s"><kbd>S</kbd> save PNG</button></div><div id="art" aria-label="Retained radial profile composition"></div><p id="status" role="status">Preparing profiles…</p><p>Edit <code>profile-marks.js</code> to supply increasing axial radius pairs, and <code>sketch.js</code> to change placement, light or flat-face drawing.</p></main><script src="/p5.js"></script><script type="module" src="./sketch.js"></script></body></html>
