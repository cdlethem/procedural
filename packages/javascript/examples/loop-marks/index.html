<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loop marks — procedurals</title>
<style>
 body{margin:0;padding:24px;background:#f5f2e9;color:#242324;font:16px system-ui,sans-serif}
 main{max-width:1040px;margin:auto}h1{margin:0 0 8px;font-size:28px}p{line-height:1.5;max-width:70ch}
 #controls{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0}button{font:inherit;padding:8px 10px;background:#fff;color:inherit;border:1px solid #777;cursor:pointer}
 button[aria-pressed="true"]{background:#dce7df}.parameter-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px;margin:20px 0}
 .control{display:grid;grid-template-columns:minmax(0,1fr) 76px;align-items:center;gap:5px;padding:8px;background:#fff;border:1px solid #d4d0c8}
 .control span{grid-column:1/-1;font-size:14px}.control input[type="range"]{width:100%}.control input[type="number"]{width:67px}.control select{grid-column:1/-1;max-width:100%}
 canvas{display:block;width:min(640px,100%);height:auto;background:#f5f2e9}#status{min-height:1.5em}
</style>
<main><h1>Loop marks</h1><p>Build closed spline loops, then draw outlines, edge marks, or translucent fans. The canvas stays transparent between marks.</p>
<div id="controls">
 <button data-action="c">C palette</button><button data-action="legacy" aria-pressed="false">Original composition</button>
 <button data-action="t" hidden>T move original control</button><button data-action="m" hidden>M original fans</button>
 <button data-action="0">0 reset</button><button data-action="s">S save transparent PNG</button>
</div>
<div id="art" aria-label="Loop marks generated artwork"></div><p id="status" role="status">Preparing Loop marks…</p>
</main><script src="/p5.js"></script><script type="module" src="./sketch.js"></script>
</html>
