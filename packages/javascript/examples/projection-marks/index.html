<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Projection marks</title>
<style>
  body { margin:0; padding:24px; background:#f8f5ee; color:#242324; font:16px system-ui,sans-serif; }
  main { max-width:1040px; margin:auto; }
  p { max-width:70ch; line-height:1.5; }
  #controls { display:grid; grid-template-columns:repeat(auto-fit,minmax(165px,1fr)); gap:13px; margin:22px 0; }
  label { display:grid; gap:5px; font-size:14px; font-weight:600; }
  label[hidden] { display:none; }
  input,select,button { min-height:39px; padding:7px 9px; border:1px solid #888; border-radius:4px; background:white; color:inherit; font:inherit; }
  button { cursor:pointer; align-self:end; }
  button:hover { background:#eae7df; }
  canvas { display:block; width:min(640px,100%); height:auto; background:#ece7da; box-shadow:0 2px 14px #0002; }
  #status { min-height:1.5em; font-size:14px; }
</style>
<main>
  <h1>Projection marks</h1>
  <p>Arrange rows, columns or spokes, then project their samples away from one or two ordered discs. Move and resize each disc, and adjust how strongly it pushes the source paths.</p>
  <form id="controls" aria-label="Projection marks controls" onsubmit="return false"></form>
  <div id="art" aria-label="Projection marks artwork"></div>
  <p id="status" role="status">Preparing projection marks…</p>
</main>
<script src="/p5.js"></script>
<script type="module" src="./sketch.js"></script>
